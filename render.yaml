databases:
  - name: cap-postgres
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: cap-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: cap-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    domains:
      - api.cap-protocol.org
    preDeployCommand: pnpm db:migrate
    envVars: &api-env
      - key: DATABASE_URL
        fromDatabase:
          name: cap-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cap-redis
          property: connectionString
      - key: API_PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SHOPIFY_APP_URL
        value: https://api.cap-protocol.org
      - key: DASHBOARD_URL
        value: https://dashboard.cap-protocol.org
      - key: SHOPIFY_TIMEOUT_MS
        value: "10000"
      - key: OPENAI_API_KEY
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  - type: worker
    name: cap-catalog-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: pnpm --filter @cap/api start:worker:catalog
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars: *api-env

  - type: worker
    name: cap-enrichment-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: pnpm --filter @cap/api start:worker:enrichment
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars: *api-env

  - type: web
    name: cap-dashboard
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.dashboard
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /
    domains:
      - dashboard.cap-protocol.org
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cap-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cap-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://api.cap-protocol.org
      - key: DASHBOARD_URL
        value: https://dashboard.cap-protocol.org
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
