name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cap_user:cap_password@127.0.0.1:5432/cap_db
      REDIS_URL: redis://127.0.0.1:6379
      OPENAI_API_KEY: sk-ci-placeholder
      ENCRYPTION_KEY: 5c1d0e8a7f3b9c2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d
      SHOPIFY_API_SECRET: ci-shopify-secret
      DASHBOARD_SESSION_SECRET: ci-only-dashboard-session-secret-32
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cap_user
          POSTGRES_PASSWORD: cap_password
          POSTGRES_DB: cap_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cap_user -d cap_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm --filter=@cap/db exec prisma validate --schema prisma/schema.prisma

      - name: Validate deployment blueprints
        run: ruby -e 'require "yaml"; Psych.parse_file("render.yaml"); Psych.parse_file("render.staging.yaml")'

      - name: Apply test database migrations
        run: pnpm db:migrate

      - name: Check Prisma schema matches migrations
        run: pnpm db:check-drift

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test compiled API
        env:
          API_PORT: 3100
        run: |
          pnpm --filter=@cap/api start > /tmp/cap-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3100/health > /tmp/cap-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/cap-health.json || {
            cat /tmp/cap-api.log
            exit 1
          }
